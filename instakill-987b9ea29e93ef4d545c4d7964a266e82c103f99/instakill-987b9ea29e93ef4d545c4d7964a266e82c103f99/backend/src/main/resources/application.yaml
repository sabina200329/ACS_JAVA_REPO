spring:
  datasource:
    url: jdbc:sqlite:./instakill.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
server:
  servlet:
    context-path: /
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger
management:
  endpoints:
    web:
      exposure:
        include: health,info
instakill:
  jwt:
    secret: change-me-change-me-change-me-change-me-change-me-secret-key-1234
    issuer: instakill
    ttl-minutes: 120
  notifications:
    enabled: true
    topic-url: https://ntfy.sh/instakill_sabina_demo
  # Lab 7: LLM local (LM Studio) cu API compatibil OpenAI
  llm:
    url: ${LOCAL_LLM_URL:http://localhost:12345/v1/chat/completions}
    model: ${LOCAL_LLM_MODEL:google/gemma-3-270m}
    connect-timeout: 3s
    read-timeout: ${LOCAL_LLM_TIMEOUT:30s}
logging:
  level:
    org.hibernate.SQL: warn

media:
  base-path: media
