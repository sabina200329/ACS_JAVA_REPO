<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: layout('Create Post', ~{::section})}">
    <section>
        <h1>Create a post</h1>
        <form th:action="@{/posts}" th:object="${postForm}" method="post" class="form" id="postForm">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label>Content
                <textarea th:field="*{content}" rows="4"></textarea>
            </label>
            <div class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>

            <!-- Lab 7: rescriere amuzantă cu LLM-ul local -->
            <div class="funny-row">
                <button type="button" id="funnyButton" class="funny-button">
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="funny-label">😄 Make It Funnier</span>
                </button>
                <button type="button" id="undoFunnyButton" class="link-button" hidden>Undo</button>
                <small id="funnyStatus" class="funny-status" role="status"></small>
            </div>

            <label>Upload a photo or video
                <input type="file" id="mediaFileInput" accept="image/*,video/mp4,video/quicktime,video/webm"/>
            </label>
            <small id="uploadStatus"></small>

            <label>…or paste an image/video URL
                <input type="text" id="imageUrlInput" th:field="*{imageUrl}" placeholder="https://..."/>
            </label>
            <div class="error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>

            <button type="submit" id="publishButton">Publish</button>
        </form>

        <div id="funnyToast" class="toast" role="status" hidden>Your post just got funnier 😄</div>

        <script>
            // Lab 7: butonul „Make It Funnier” -> POST /api/funnyfy
            (function () {
                const textarea = document.getElementById('content');
                const button = document.getElementById('funnyButton');
                const undo = document.getElementById('undoFunnyButton');
                const status = document.getElementById('funnyStatus');
                const toast = document.getElementById('funnyToast');
                let previousText = null;
                let toastTimer = null;

                function setLoading(loading) {
                    button.disabled = loading;
                    button.classList.toggle('loading', loading);
                    button.querySelector('.funny-label').textContent = loading ? 'Making it funnier…' : '😄 Make It Funnier';
                }

                function showToast() {
                    toast.hidden = false;
                    clearTimeout(toastTimer);
                    toastTimer = setTimeout(() => { toast.hidden = true; }, 3000);
                }

                button.addEventListener('click', async function () {
                    const text = textarea.value.trim();
                    status.className = 'funny-status';
                    if (!text) {
                        status.textContent = 'Write something first 🙂';
                        return;
                    }
                    setLoading(true);
                    status.textContent = '';
                    try {
                        const response = await fetch('/api/funnyfy', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text }),
                            credentials: 'same-origin'
                        });
                        const body = await response.json().catch(() => ({}));
                        if (!response.ok) {
                            throw new Error(body.detail || ('Request failed (' + response.status + ')'));
                        }
                        previousText = textarea.value;
                        textarea.value = body.text;
                        undo.hidden = false;
                        showToast();
                    } catch (err) {
                        status.textContent = 'Could not make it funnier: ' + err.message;
                        status.className = 'funny-status error';
                    } finally {
                        setLoading(false);
                    }
                });

                undo.addEventListener('click', function () {
                    if (previousText !== null) {
                        textarea.value = previousText;
                        previousText = null;
                    }
                    undo.hidden = true;
                    status.textContent = '';
                });
            })();

            (function () {
                const form = document.getElementById('postForm');
                const fileInput = document.getElementById('mediaFileInput');
                const urlInput = document.getElementById('imageUrlInput');
                const status = document.getElementById('uploadStatus');
                const publish = document.getElementById('publishButton');

                form.addEventListener('submit', async function (e) {
                    const file = fileInput.files[0];
                    if (!file) {
                        return; // fără fișier: se trimite formularul normal (cu URL-ul lipit, dacă există)
                    }
                    e.preventDefault();
                    publish.disabled = true;
                    status.textContent = 'Uploading ' + file.name + '...';

                    try {
                        const formData = new FormData();
                        formData.append('file', file);
                        const response = await fetch('/api/media', {
                            method: 'POST',
                            body: formData,
                            credentials: 'same-origin'
                        });
                        if (!response.ok) {
                            let message = 'Upload failed (' + response.status + ')';
                            try {
                                const problem = await response.json();
                                if (problem.detail) message = problem.detail;
                            } catch (ignored) { }
                            throw new Error(message);
                        }
                        const result = await response.json();
                        urlInput.value = result.mediaUrl;
                        fileInput.value = '';
                        form.submit();
                    } catch (err) {
                        status.textContent = err.message;
                        status.className = 'error';
                        publish.disabled = false;
                    }
                });
            })();
        </script>
    </section>
</div>
</body>
</html>
